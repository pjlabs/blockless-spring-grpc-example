syntax = "proto3";

package org.pjlabs.example;

option java_multiple_files = true;
option java_package = "org.pjlabs.example.proto";

service GreetingService {
  // Single greeting — demonstrates Blockless.get()
  rpc Greet (GreetRequest) returns (GreetReply);

  // Fan-out greeting — demonstrates Parallel.map() with withMaxConcurrency
  rpc GreetAll (GreetAllRequest) returns (GreetAllReply);

  // Partial failure handling — demonstrates Parallel.toEither()
  rpc GreetSafe (GreetAllRequest) returns (GreetSafeReply);
}

message GreetResult {
  oneof outcome {
    GreetReply reply = 1;
    string error = 2;
  }
}

message GreetRequest {
  string name = 1;
}

message GreetReply {
  string message = 1;
  string thread_name = 2;
  bool virtual_thread = 3;
  string trace_id = 4;
}

message GreetAllRequest {
  repeated string names = 1;
}

message GreetAllReply {
  repeated GreetReply replies = 1;
}

message GreetSafeReply {
  repeated GreetResult results = 1;
}